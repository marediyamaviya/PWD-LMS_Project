spring.application.name=assessment-service
server.port=8082
spring.jpa.open-in-view=false

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3307/assessment_db
spring.datasource.username=root
spring.datasource.password=root

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT verification (must match identity-service)
jwt.secret=your-very-long-secret-key-change-this-later
